name: HDX/CKAN create image

on:
  push:
    branches:
      - dev
      - prod
      - hdx-*
    tags: [ '*' ]
  workflow_dispatch:

jobs:

  check_pr:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check if we have a push that is part of a PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Proceeding: Pull request event"
            echo "proceed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PR_COUNT=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${{ github.ref_name }}" \
            --jq '. | length' 2>/dev/null || echo "0")
          if [[ $PR_COUNT -gt 0 ]]; then
            echo "Skipping: Open PR found for branch ${{ github.ref_name }}"
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding: No open PR found for branch ${{ github.ref_name }}"
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: check_pr
    if: needs.check_pr.outputs.proceed == 'true'
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v3

      - name: Repo Info
        id: repo_info
        run: |
          export REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo ::set-output name=REPO_NAME::${REPO_NAME}

      - name: Tag Info
        id: tag_info
        run: |
          export IMAGE_TAG="${GITHUB_REF#refs/*/}"
          export IMAGE_TAG=${IMAGE_TAG//[^[:alnum:].-]/-}
          echo ::set-output name=IMAGE_TAG::$([[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && echo "$GITHUB_SHA" || echo "$IMAGE_TAG")
      - name: Show image tag
        run: |
          echo "Image tag is ${{ steps.tag_info.outputs.IMAGE_TAG }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Public ECR
        uses: docker/login-action@v2
        with:
          registry: public.ecr.aws
          username: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
        env:
          AWS_REGION: us-east-1

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v3
        with:
          push: true
          file: ./Dockerfile
          tags: public.ecr.aws/unocha/${{ steps.repo_info.outputs.REPO_NAME }}:${{ steps.tag_info.outputs.IMAGE_TAG }}

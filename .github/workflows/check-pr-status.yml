name: Check PR Status

on:
  workflow_call:
    inputs:
      base:
        description: >-
          Skip only when every open PR from this branch targets this base branch (the base the
          caller's pull_request trigger covers). Empty means skip for an open PR to any base.
        type: string
        required: false
        default: ''
    outputs:
      proceed:
        description: Whether to proceed with the main job (true if pull_request or no open PR for push)
        value: ${{ jobs.check_pr.outputs.proceed }}

jobs:
  check_pr:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check if should proceed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ inputs.base }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Proceeding: Pull request event"
            echo "proceed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # base branches of the open PRs from this branch; on an API error, proceed
          PR_BASES=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/pulls?state=open&head=$OWNER:$BRANCH" \
            --jq '[.[].base.ref]' 2>/dev/null || echo '[]')
          PR_COUNT=$(echo "$PR_BASES" | jq 'length')
          OTHER_BASE_COUNT=$(echo "$PR_BASES" | jq --arg base "$BASE" \
            'if $base == "" then 0 else map(select(. != $base)) | length end')
          if [[ $PR_COUNT -gt 0 && $OTHER_BASE_COUNT -eq 0 ]]; then
            echo "Skipping: Open PR found for branch $BRANCH (bases: $PR_BASES)"
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "Proceeding: No open PR found for branch $BRANCH that would run this workflow (bases: $PR_BASES)"
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

{% set input_id = id if id else "checkbox-" ~ name %}
<div class="checkbox-field form-check{% if spacing_class %} {{ spacing_class }}{% endif %}"
  {% if container_title %}title="{{ container_title }}"{% endif %}
  {% if container_data_attributes %}{% for key, value in container_data_attributes.items() %} data-{{ key }}="{{ value }}" {% endfor %}{% endif %}>
  <div>
    <input
            class="form-field checkbox-field__input form-check-input"
            type="checkbox"
            name="{{ name }}"
            value="{{ value }}"
            id="{{ input_id }}"
            {% if checked %}checked{% endif %}
            {% if required %}required{% endif %}
            {% if data_attributes %}{% for key, value in data_attributes.items() %}data-{{ key }}="{{ value }}"
            {% endfor %}{% endif %}
    >
    {% if label %}
      <label
        class="checkbox-field__label form-check-label ms-2"
        for="{{ input_id }}">
        {{ label|safe }}
        {% if label_tooltip %}
          <span class="checkbox-field__tooltip" title="{{ label_tooltip }}" data-module="bs_tooltip" data-bs-toggle="tooltip">
            <i class="fa-regular fa-circle-question"></i>
          </span>
        {% endif %}
        {% if required or dynamic_required %}
          <span class="checkbox-field__required{% if dynamic_required %} d-none{% endif %}">*</span>
        {% endif %}
      </label>
    {% endif %}
    {% if data_attributes and data_attributes['validation-error'] %}
      <div class="checkbox-field__feedback-message checkbox-field__feedback-message_state_invalid invalid-feedback ms-2"></div>
    {% endif %}
  </div>
</div>
